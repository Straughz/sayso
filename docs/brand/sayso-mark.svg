    <rect x="54" y="58" width="60" height="18" rx="9"/>
    <rect x="54" y="180" width="60" height="18" rx="9"/>
    <rect x="121" y="106" width="22" height="44" rx="11"/>
    <rect x="151" y="82" width="22" height="92" rx="11"/>
    <rect x="181" y="96" width="22" height="64" rx="11"/>
  </g>
</svg>
