<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Sayso mark for 24 px and below (tray, small taskbar). Same drawing, every edge on a 16-unit grid so it lands on whole pixels at 16 px; the tile fills the canvas. -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="#1b1d22"/>
  <g fill="#f2efe8">
    <rect x="48" y="48" width="32" height="160" rx="16"/>
    <rect x="32" y="48" width="64" height="32" rx="16"/>
    <rect x="32" y="176" width="64" height="32" rx="16"/>
  </g>
  <g fill="#e8a33d">
    <rect x="96" y="96" width="32" height="64" rx="16"/>
    <rect x="144" y="64" width="32" height="128" rx="16"/>
    <rect x="192" y="80" width="32" height="96" rx="16"/>
  </g>
</svg>
